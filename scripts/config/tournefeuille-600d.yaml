# Tournefeuille (Haute-Garonne) — éclipse lunaire 28 août 2026 (DEC-008).
# Contacts locaux = UTC fournis + 2 h (CEST). Moonset spécifique au site.
# Optiques provisoires (DEC-007) — à repréciser.

site:
  name: Tournefeuille
  latitude_deg: 43.582389
  longitude_deg: 1.350944
  elevation_m: 155
  timezone: Europe/Paris

camera:
  model: Canon EOS 600D
  sensor_width_mm: 22.3
  sensor_height_mm: 14.9
  resolution_width_px: 5184
  resolution_height_px: 3456

optics:
  - name: 70-200mm @ 280mm f/5.6 (x1.4)
    focal_length_mm: 280
    aperture_f: 5.6
  - name: 70-200mm @ 200mm f/4
    focal_length_mm: 200
    aperture_f: 4.0
  - name: EF-S 15-85mm @ 28mm
    focal_length_mm: 28
    aperture_f: 5.6

simulation:
  # P1 03:24 → moonset 07:20 autour du MAX 06:13 → ±180 min couvre la séance.
  window_minutes: 180
  step_seconds: 30
  tick_minutes: 15
  overlay_stride_ticks: 2
  ephemeris_path: de421.bsp
  temperature_c: 18
  pressure_mbar: 995

framing:
  pointing_event: max
  auto_top_margin_px: 0

eclipse:
  contacts_local:
    p1: 2026-08-28T03:23:59
    u1: 2026-08-28T04:33:52
    max: 2026-08-28T06:12:55
    u4: 2026-08-28T07:52:03
    p4: 2026-08-28T09:01:47
    set: 2026-08-28T07:20:26
  # Skyfield DE421, premier run 2026-08-22 (élévation 155 m approx.).
  validation_altaz_deg:
    p1: {alt: 31.58, az: 207.67}
    u1: {alt: 24.49, az: 225.00}
    max: {alt: 10.51, az: 245.26}
    set: {alt: -0.05, az: 257.17}
